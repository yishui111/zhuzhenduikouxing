<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>轻量表情数字人 · 真人关键帧拼接</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="bootbanner">⏳ 页面加载中…</div>
  <header>
    <h1>轻量表情数字人 · 真人关键帧拼接</h1>
    <p class="sub">声音能量控制嘴型图片切换 · 不识别语音内容 · 低配电脑实时</p>
  </header>
  <div class="nav">
    <a href="/web/preprocess.html">📦 去建库工具（上传视频 → 生成嘴型图库）</a>
  </div>

  <main class="layout">
    <section class="stage">
      <canvas id="stage" width="512" height="512"></canvas>
      <canvas id="meterRaw" width="340" height="44"></canvas>
      <canvas id="meterMapped" width="340" height="44"></canvas>
      <div id="status" class="status">加载中…</div>
    </section>

    <aside class="panel">
      <h2>素材库</h2>
      <select id="lib"><option value="">加载中…</option></select>

      <h2>音频输入</h2>
      <div class="row">
        <input type="file" id="file" accept="audio/*" />
        <button id="mic">🎤 麦克风</button>
        <button id="stop">⏹ 停止</button>
      </div>

      <h2>能量 → 图片（可配置）</h2>
      <p class="hint">能量条 0~100%，按下面的范围对应到不同的嘴型图片：低于下限显示闭嘴，高于上限固定最大张，中间按范围逐张对应。</p>
      <div class="slider"><label>能量下限（低于→闭嘴） <span id="p_elo_val"></span></label><input type="range" id="p_elo" min="0" max="60" step="1" value="30" /></div>
      <div class="slider"><label>能量上限（高于→最大张） <span id="p_ehi_val"></span></label><input type="range" id="p_ehi" min="40" max="100" step="1" value="85" /></div>
      <div class="slider"><label>低于下限的保持时长（防闪回） <span id="p_eloHold_val"></span></label><input type="range" id="p_eloHold" min="0" max="2000" step="100" value="400" /></div>

      <h2>参数</h2>
      <div class="slider"><label>换帧间隔（越大换得越慢） <span id="p_sw_val"></span></label><input type="range" id="p_sw" min="100" max="2000" step="50" value="300" /></div>
      <div class="slider"><label>灵敏度 <span id="p_sens_val"></span></label><input type="range" id="p_sens" min="0.2" max="2" step="0.05" value="1" /></div>
      <div class="slider"><label>强度 <span id="p_strength_val"></span></label><input type="range" id="p_strength" min="0.2" max="1.5" step="0.05" value="1" /></div>
      <div class="slider"><label>声音频率(F0)权重（0=纯能量） <span id="p_f0w_val"></span></label><input type="range" id="p_f0w" min="0" max="100" step="1" value="34" /></div>
      <div class="slider"><label>过渡时长（切换柔和度） <span id="p_trans_val"></span></label><input type="range" id="p_trans" min="60" max="250" step="10" value="100" /></div>
      <div class="slider"><label>静音门限（0=自动） <span id="p_sil_val"></span></label><input type="range" id="p_sil" min="-70" max="0" step="1" value="0" /></div>

      <h2>导出</h2>
      <div class="row">
        <button id="rec">● 开始录制</button>
        <button id="recStop" disabled>⏹ 停止并下载</button>
      </div>
    </aside>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
